name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Security Audit ────────────────────────────────────────────────
  security:
    name: Security (SAST + SCA)
    uses: ./.github/workflows/_security.yml
    with:
      node_version: '22'
      audit_level: 'high'

  # ── Quality Gates ─────────────────────────────────────────────────
  quality:
    needs: [security]
    uses: ./.github/workflows/_quality.yml
    with:
      node_version: '22'
      coverage_threshold: 95

  # ── Publish (on tag) ──────────────────────────────────────────────
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [security, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm
      url: https://www.npmjs.com/package/@agentix-e/db-operations
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Verify package
        run: |
          echo "Package: $(node -e 'console.log(require(\"./package.json\").name)')"
          echo "Version: $(node -e 'console.log(require(\"./package.json\").version)')"
          echo "Tag: ${{ github.ref_name }}"
      - name: Publish
        run: npm publish --access public --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
