name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # ── Quality Gates ─────────────────────────────────────────────────
  quality:
    uses: ./.github/workflows/_quality.yml
    with:
      node_version: '22'
      coverage_threshold: 95

  # ── Publish to npm ───────────────────────────────────────────────
  publish:
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/@agentix-e/db-operations
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Verify version matches tag
        run: |
          PKG_VERSION="v$(node -e 'console.log(require(\"./package.json\").version)')"
          TAG="${{ github.ref_name }}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "❌ package.json version ($PKG_VERSION) != git tag ($TAG)"
            exit 1
          fi
          echo "✅ Version check passed: $TAG"
      - name: Publish (dry-run — set NPM_TOKEN to publish for real)
        run: npm publish --access public --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── GitHub Release ───────────────────────────────────────────────
  github-release:
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Generate release notes from changelog
        run: |
          echo "## Release ${{ github.ref_name }}" > release-notes.md
          echo "" >> release-notes.md
          # Extract relevant section from CHANGELOG
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          awk "/^## $VERSION/,/^## [0-9]/" CHANGELOG.md | head -n -1 | tail -n +2 >> release-notes.md 2>/dev/null || echo "See CHANGELOG.md for details." >> release-notes.md
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          generate_release_notes: true
