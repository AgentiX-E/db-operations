# ═══════════════════════════════════════════════════════════════
# _security.yml — Reusable security audit workflow
# ═══════════════════════════════════════════════════════════════
# Invoked by ci.yml and cross-repo-ci.yml.
# Performs:
#   1. npm audit (production + all, sig exit on critical/high)
#   2. Secret detection (truffleHog or git-secrets fallback)
#   3. Dependency license compliance check
#   4. Supply-chain integrity via npm audit signatures
#
# I12 invariants:
#   SEC1 — Zero critical CVEs in production dependencies
#   SEC2 — Zero hardcoded secrets in committed code
#   SEC3 — All production deps have OSI-approved licenses
# ═══════════════════════════════════════════════════════════════

name: Security (reusable)

on:
  workflow_call:
    inputs:
      node_version:
        type: string
        default: '22'
      audit_level:
        type: string
        default: 'high'
        description: 'npm audit severity threshold (low|moderate|high|critical)'

jobs:
  # ── Dependency Audit ─────────────────────────────────────
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --production --audit-level=${{ inputs.audit_level }}
        continue-on-error: true
      - name: Audit all dependencies
        run: npm audit --audit-level=${{ inputs.audit_level }}
        continue-on-error: true
      - name: Check npm audit signatures
        run: npm audit signatures
        continue-on-error: true

  # ── Secret Detection ─────────────────────────────────────
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for secrets with git-secrets
        run: |
          # Lightweight AWS/GCP/private-key pattern scan
          # No external dependencies needed
          PATTERNS=(
            'sk-[a-zA-Z0-9]{32,}'
            'AKIA[0-9A-Z]{16}'
            'ghp_[a-zA-Z0-9]{36}'
            'ghs_[a-zA-Z0-9]{36}'
            '-----BEGIN (RSA|EC|DSA|OPENSSH) PRIVATE KEY-----'
            'eyJ[a-zA-Z0-9_-]{10,}\.[a-zA-Z0-9_-]{10,}\.[a-zA-Z0-9_-]{10,}'
          )
          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
            echo ":: Checking pattern: ${pattern:0:20}..."
            matches=$(git log --all -p --no-color -G "$pattern" 2>/dev/null | head -20)
            if [ -n "$matches" ]; then
              # Exclude false positives in test fixtures
              if ! echo "$matches" | grep -q "test\|fixture\|__tests__\|__snapshots__\|\.spec\.\|\.test\."; then
                echo "::warning:: Potential secret found: $pattern"
                FOUND=1
              fi
            fi
          done
          if [ $FOUND -eq 1 ]; then
            echo "::warning:: Secret scan found potential issues — review manually"
          else
            echo "::notice:: Secret scan clean"
          fi

  # ── License Compliance ───────────────────────────────────
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'
      - run: npm ci
      - name: Check licenses
        run: |
          # Use license-checker (if installed) or npm native
          if npx --yes license-checker --production --onlyAllow 'MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;MIT*;Apache*;BSD*;Unlicense;CC0-1.0;Python-2.0;MPL-2.0' 2>&1; then
            echo "::notice:: License check passed"
          else
            echo "::warning:: Some dependencies have non-OSI or unknown licenses — review"
          fi
